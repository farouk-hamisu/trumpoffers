<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0b; }
  body { font-family: 'Inter', sans-serif; color: #f3eee4; }
  .og { position: relative; display: grid; grid-template-columns: 1.06fr 0.94fr; height: 630px; }
  .og::before { content: ''; position: absolute; inset: 20px; border: 1px solid rgba(198,162,91,.28); pointer-events: none; z-index: 3; }
  .copy { padding: 74px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 42px; height: 42px; }
  .brand-name { display: block; font-size: 17px; letter-spacing: .32em; font-weight: 500; }
  .brand-sub { display: block; font-size: 8px; letter-spacing: .5em; color: #c6a25b; margin-top: 2px; }
  .eyebrow { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: #c6a25b; display: flex; align-items: center; gap: 12px; }
  .eyebrow::before { content: ''; width: 30px; height: 1px; background: #c6a25b; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 68px; line-height: .94; letter-spacing: -.035em; margin-top: 18px; max-width: 9ch; }
  h1 em { font-style: italic; font-weight: 300; color: #e3c88f; }
  .lede { margin-top: 20px; font-size: 13px; line-height: 1.7; color: #b6b1a7; font-weight: 300; max-width: 38ch; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 8px; letter-spacing: .18em; text-transform: uppercase; color: #817d75; }
  .foot span:last-child { color: #c6a25b; }
  .visual { position: relative; overflow: hidden; }
  .visual img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.32) contrast(1.14) brightness(.52); }
  .visual::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0a0a0b 0%, rgba(10,10,11,.12) 32%, rgba(10,10,11,.15) 70%, rgba(10,10,11,.75) 100%), radial-gradient(ellipse at 70% 40%, rgba(198,162,91,.18), transparent 65%); }
  .stamp { position: absolute; right: 58px; bottom: 54px; z-index: 2; text-align: right; }
  .stamp strong { display: block; font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 400; line-height: 1; color: #f0d9a7; }
  .stamp small { display: block; margin-top: 6px; font-size: 8px; letter-spacing: .22em; text-transform: uppercase; color: #b6b1a7; }
</style>
</head>
<body>
  <div class="og">
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 48 48" fill="none" stroke="#c6a25b" stroke-width="1.1"><path d="M24 2.5 45.5 24 24 45.5 2.5 24Z"/><path d="M15 15.5h18M24 15.5v17" stroke="#f0d9a7" stroke-width="1.7"/></svg>
        <div><span class="brand-name">TRUMP</span><span class="brand-sub">OFFERS</span></div>
      </div>
      <div>
        <p class="eyebrow">Executive Membership &amp; Privileges</p>
        <h1>Opportunities. <em>Rewards.</em> Possibilities.</h1>
        <p class="lede">An elevated rewards, executive recruitment and digital membership card experience.</p>
      </div>
      <div class="foot"><span>New York · London · Singapore</span><span>trumpoffers.com</span></div>
    </div>
    <div class="visual">
      <img src="../assets/images/architecture-1600.webp" alt="">
      <div class="stamp"><strong>$30,000</strong><small>Executive member balance</small></div>
    </div>
  </div>
</body>
</html>
