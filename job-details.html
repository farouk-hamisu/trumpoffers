<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role — Trump Offers</title>
  <meta name="description" content="Review an open opportunity at Trump Offers and submit a considered application.">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/cormorant-garamond-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="careers" data-header-solid="true">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero page-hero--light page-hero--compact">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb" style="color:var(--ink-faint)">
          <a href="index.html">Home</a><span class="breadcrumb__sep">/</span>
          <a href="careers.html">Careers</a><span class="breadcrumb__sep">/</span>
          <span data-job-crumb>Role</span>
        </nav>
        <div class="page-hero__grid" style="margin-top:28px">
          <div>
            <p class="eyebrow" style="color:var(--gold-deep)" data-job-dept>Opportunity</p>
            <h1 class="page-hero__title" style="font-size:clamp(2.6rem,5.6vw,5.2rem)" data-job-title>Loading role…</h1>
          </div>
          <div class="page-hero__aside">
            <p class="page-hero__lede" style="color:var(--ink-muted);margin-top:0" data-job-summary></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--light" style="padding-top:clamp(44px,6vw,80px)">
      <div class="container">
        <div class="job-detail">
          <article class="job-detail__body" data-job-body>
            <div class="skeleton" style="height:20px;margin-bottom:12px"></div>
            <div class="skeleton" style="height:20px;margin-bottom:12px;width:88%"></div>
            <div class="skeleton" style="height:20px;width:64%"></div>
          </article>
          <aside class="job-side" data-job-side>
            <div class="skeleton" style="height:220px"></div>
          </aside>
        </div>
      </div>
    </section>

    <section class="section section--charcoal" style="padding-block:clamp(50px,7vw,90px)">
      <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div>
          <p class="eyebrow"><span class="eyebrow__line"></span>Application support</p>
          <h2 class="display--sm" style="margin-top:14px">Questions before you <em>apply?</em></h2>
        </div>
        <a class="btn btn--ghost" href="contact.html">Speak to the team</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/vendor/supabase.js"></script>
  <script src="js/env.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/job.js"></script>
  <script src="js/livechat.js"></script>
</body>
</html>
