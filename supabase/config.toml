# ============================================================================
# Trump Offers — Supabase local development configuration
# ============================================================================

project_id = "trump-offers"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/login.html",
  "http://localhost:8080/login.html?mode=update",
  "http://localhost:8080/dashboard.html"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false

[edge_runtime]
enabled = true

# BIN/IIN lookup proxy. Public by design (no JWT), rate-limited per caller.
[functions.bin-lookup]
enabled = true
verify_jwt = false
